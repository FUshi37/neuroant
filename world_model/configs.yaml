defaults:

  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  video_pred_log: false
  exptid: 'default'
  # Environment
  task: 'hexapod'
  num_actions: 18

  # Model
  dyn_hidden: 512
  dyn_deter: 512
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  grad_heads: ['decoder', 'reward']
  units: 512 # = other heads except decoder, e.g., reward
  act: 'SiLU'
  norm: True
  encoder:
    {mlp_keys: '.*', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}
  decoder:
    {mlp_keys: '.*', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
  actor:
    {layers: 2, dist: 'normal', entropy: 3e-4, unimix_ratio: 0.01, std: 'learned', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic:
    {layers: 2, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  reward_head:
    {layers: 2, dist: 'normal', loss_scale: 1.0, outscale: 0.0} #'symlog_disc'
  cont_head:
    {layers: 2, loss_scale: 1.0, outscale: 1.0}
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'

  # Training
  stage: 'policy'
  train_steps_per_iter: 10
  train_start_steps: 10000
  batch_size: 16 #32 #16 #16 #8 # 16
  batch_length: 64 #160 #64*5=320 #64 #32 # 64
  train_ratio: 512 #512
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  opt: 'adam'
  entropy_coef: 0.00001
  vel_predict_coef: 1.0
  ppo_clip: 0.2
  decode_pri_obs: True

  # Behavior
  imag_horizon: 10 # 15
  imag_start_batch: 6
  use_imagination: False
  use_clipped_value_loss: True
  clip_param: 0.2
  discount: 0.997
  discount_lambda: 0.95
  imag_gradient: 'dynamics'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Exploration
  expl_behavior: 'greedy' #'plan2explore'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

  # Environment
  reward_EMA: True
  phase_model: False
  enable_foothold_prediction: False
  foothold_delay: 1
  foothold_loss_scale: 0.1
  foothold_hind_leg_indices: [2, 3, 4, 5]
  omega_max: 12.566370614359172 # 4 * pi
  dt: 0.02